<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Averon Projects</title>
<meta name="theme-color" content="#1B2A41">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Averon Projects">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#1B2A41;--navy2:#24385A;--navy3:#33507F;--orange:#E8702A;--orange-l:#FDEBDD;
  --bg:#F3F5F8;--card:#FFFFFF;--line:#E2E6EC;--text:#1D2939;--muted:#667085;
  --green:#12B76A;--green-l:#E3F8EE;--red:#D92D20;--red-l:#FDECEA;--amber:#DC8A06;--amber-l:#FEF4E2;--blue:#2E6BD8;--blue-l:#E6EEFB;
  --r:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy3)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%)}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.login-card h1{font-size:20px;margin:22px 0 4px}
.login-card p{margin:0 0 20px}

/* ---------- shell ---------- */
#app{display:flex;min-height:100%}
#side{align-self:flex-start;width:228px;background:var(--navy);color:#C9D3E3;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .brand{color:#fff;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand small{display:block;font-weight:400;font-size:11px;color:#8FA0BC;letter-spacing:1.2px;text-transform:uppercase}
#nav{padding:10px 8px;flex:1;overflow:auto}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#C9D3E3;text-decoration:none;font-weight:500;margin-bottom:2px}
#nav a:hover{background:rgba(255,255,255,.06);color:#fff}
#nav a.active{background:rgba(232,112,42,.16);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
#nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
#side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
#side .foot button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:6px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:none;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30;padding-top:max(10px,env(safe-area-inset-top))}
#topbar button{background:none;border:0;color:#fff;padding:4px;cursor:pointer}
#content{padding:22px 26px 60px;max-width:1400px;width:100%}
#scrim{display:none}

@media (max-width:860px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  #app.nav-open #side{transform:none}
  #app.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  #topbar{display:flex}
  #content{padding:16px 16px 60px}
}

/* ---------- common ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:22px;font-weight:700}
.page-head .sub{color:var(--muted);margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#C5CCD6}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:#D5621F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:#EEF1F5;color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--red)}
.kpi.good .v{color:var(--green)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#EEF1F5;color:#475467}
.b-green{background:var(--green-l);color:#067647}
.b-red{background:var(--red-l);color:#B42318}
.b-amber{background:var(--amber-l);color:#B54708}
.b-blue{background:var(--blue-l);color:#1849A9}
.b-navy{background:var(--navy);color:#fff}
.b-orange{background:var(--orange-l);color:#B54708}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#F8F9FB}
.tbl tfoot td{font-weight:700;background:#FAFBFC;border-top:1px solid var(--line)}
.tbl th.num{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.prog{height:7px;background:#E9EDF2;border-radius:99px;overflow:hidden;min-width:80px}
.prog > i{display:block;height:100%;background:var(--orange);border-radius:99px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff;min-width:0}
.filters input[type=search]{flex:1;min-width:200px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.active{color:var(--navy);border-color:var(--orange)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.list-item:last-child{border-bottom:0}
.pipeline{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.pipe{background:#F6F7F9;border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center}
.pipe .n{font-size:22px;font-weight:700}
.pipe .t{font-size:11px;color:var(--muted);line-height:1.2;margin-top:3px}
.pipe.on{background:var(--orange-l);border-color:#F6C7A6}
@media (max-width:860px){.pipeline{grid-template-columns:repeat(3,1fr)}}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.alert.warn{background:var(--amber-l);color:#93370D;border:1px solid #F8D9A8}
.alert.ok{background:var(--green-l);color:#05603A;border:1px solid #ABEFC6}
.alert.err{background:var(--red-l);color:#912018;border:1px solid #FECDCA}

/* timeline */
.tl{position:relative;padding:4px 0}
.tl-row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px;height:30px}
.tl-row .lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:18px;background:#F3F5F8;border-radius:4px}
.tl-plan{position:absolute;top:2px;height:14px;background:#C9D3E3;border-radius:3px}
.tl-act{position:absolute;top:6px;height:6px;background:var(--orange);border-radius:3px}
.tl-act.done{background:var(--green)}
.tl-today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);opacity:.6}
.tl-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.tl-legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
@media (max-width:640px){.tl-row{grid-template-columns:96px 1fr}}

/* forms & modal */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#FAFBFC;border-radius:0 0 12px 12px}
.modal-f .r{display:flex;gap:8px;margin-left:auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;font-weight:600;color:#475467;margin-bottom:5px}
.fld label .req{color:var(--red)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #D0D5DD;border-radius:8px;padding:9px 11px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid rgba(232,112,42,.35);border-color:var(--orange)}
.fld textarea{min-height:70px;resize:vertical}
.fld .help{font-size:12px;color:var(--muted);margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid #D0D5DD;border-radius:8px;padding:7px 11px;font-weight:500;font-size:13px;color:var(--text);margin:0;cursor:pointer}
.checks input{width:auto}
.form-err{margin-bottom:12px}
.sect-title{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--orange);font-weight:700;margin-top:6px;border-top:1px dashed var(--line);padding-top:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;max-width:calc(100% - 32px)}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(243,245,248,.8);z-index:150;font-weight:600;color:var(--navy)}
.spin{width:22px;height:22px;border:3px solid #D0D5DD;border-top-color:var(--orange);border-radius:50%;animation:sp 0.8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.done-row td{color:var(--muted)}
.done-row .t-title{text-decoration:line-through}
.row-actions{display:flex;gap:2px;justify-content:flex-end;white-space:nowrap}
.row-actions.stack{flex-direction:column;align-items:stretch;gap:4px}
.row-actions.stack .btn{justify-content:center}
.row-actions.stack .icon-btn{align-self:flex-end}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="brand-mark">A</div><div>AVERON AUTOMATION</div></div>
    <h1>Project Tracker</h1>
    <p class="muted">Sign in to continue</p>
    <div id="loginErr" class="alert err hidden"></div>
    <div class="fld" style="margin-bottom:12px"><label>Email</label><input type="email" id="lgEmail" required autocomplete="username"></div>
    <div class="fld" style="margin-bottom:18px"><label>Password</label><input type="password" id="lgPass" required autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%;justify-content:center" id="lgBtn">Sign in</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div id="scrim" data-act="closeNav"></div>
  <aside id="side">
    <div class="brand"><div class="brand-mark">A</div><div>AVERON<small>Project Tracker</small></div></div>
    <nav id="nav"></nav>
    <div class="foot"><div id="whoami" class="muted" style="color:#8FA0BC;word-break:break-all"></div><button data-act="logout">Sign out</button></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <button data-act="openNav" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <strong>Averon Projects</strong>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="hidden"></div>
<div id="loading" class="hidden"><div class="spin"></div><span id="loadingTxt">Loading…</span></div>

<script>
/* =====================================================================
   CONFIG — paste your Supabase project URL and anon (public) key here
   ===================================================================== */
const SUPABASE_URL = 'https://lnnalvtolcakrdiotuqi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubmFsdnRvbGNha3JkaW90dXFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Njg4OTQsImV4cCI6MjEwODM0NDg5NH0.ULW71g7wi4fGLGWz4LP5zoVsdZ7FmNxSk_aCCEtcFFA';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- constants ---------------- */
const STAGES = ['Design / FDS','Panel build','PLC/HMI development','FAT','Dispatch','Installation','Commissioning','SAT','Handover'];
const STAGE_WEIGHTS = [12,12,20,8,3,10,15,10,10]; // used by "Auto-plan"
const EXP_CATS = ['Hardware','Panel fabrication','Bought-out items','Software/licenses','Travel','Lodging & food','Subcontract','Misc'];
const BUDGET_CATS = ['Labour', ...EXP_CATS];
const SCOPES = ['PLC','HMI','SCADA','Panel'];
const PLATFORMS = ['Siemens','Mitsubishi','Delta','Allen-Bradley / Rockwell','Schneider','zenon','FT Optix','Multiple','Other'];
const P_STATUS = ['Active','On Hold','Completed','Cancelled'];
const S_STATUS = ['Not Started','In Progress','Done','Skipped'];
const T_STATUS = ['Open','In Progress','Done'];
const T_PRIORITY = ['Low','Normal','High'];
const PAY_MODES = ['NEFT/RTGS','Cheque','UPI','Cash','Other'];
const TABLES = {clients:'clients',engineers:'engineers',projects:'projects',stages:'project_stages',tasks:'tasks',
  timeLogs:'time_logs',expenses:'expenses',budget:'project_budget',milestones:'payment_milestones',receipts:'payment_receipts'};

const ICONS = {
  dashboard:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  projects:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  entry:'<path d="M12 5v14M5 12h14"/>',
  receivables:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  masters:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  backup:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'
};
const NAV = [['dashboard','Dashboard'],['projects','Projects'],['tasks','Tasks'],['entry','Quick Entry'],['receivables','Receivables'],['masters','Masters'],['backup','Backup']];

/* ---------------- state ---------------- */
let S = {}; Object.keys(TABLES).forEach(k => S[k] = []);
let USER = null;
const UI = { projSearch:'', projStatus:'Active', taskProject:'', taskStatus:'open', masterTab:'clients' };

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = v => (v === null || v === undefined) ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + num(typeof f === 'function' ? f(x) : x[f]), 0);
const inr = (v, dec = 0) => '₹' + num(v).toLocaleString('en-IN', {minimumFractionDigits:dec, maximumFractionDigits:dec});
const pct = v => (v === null || v === undefined || !isFinite(v)) ? '—' : (Math.round(v * 10) / 10).toFixed(1) + '%';
const today = () => new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kolkata'});
const dms = s => Date.parse(s + 'T00:00:00Z');
const addDays = (s, n) => new Date(dms(s) + n * 86400000).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((dms(b) - dms(a)) / 86400000);
const fd = s => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}-${m}-${y}`; };
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const opt = (arr, sel, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') +
  arr.map(o => { const v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o;
    return `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('');

const P = id => S.projects.find(p => p.id === id);
const C = id => S.clients.find(c => c.id === id);
const E = id => S.engineers.find(e => e.id === id);
const clientName = id => C(id)?.name || '—';
const stageName = seq => seq ? (STAGES[seq - 1] || '—') : '—';
const projLabel = p => p ? `${p.project_no} · ${p.name}` : '—';

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = 'hidden', err ? 5000 : 2500);
}
function loading(on, txt) { $('#loading').classList.toggle('hidden', !on); if (txt) $('#loadingTxt').textContent = txt; }
function niceErr(e) {
  const m = e?.message || String(e);
  if (e?.code === '23503') return 'This record is linked to other records and cannot be deleted/changed.';
  if (e?.code === '23505') return 'A record with the same value already exists.';
  if (e?.code === '23514') return 'A value is outside the allowed range: ' + m;
  if (e?.code === '42501' || /row-level security/i.test(m)) return 'Not authorised for this action.';
  return m;
}

/* ---------------- data layer ---------------- */
async function fetchAll(table) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(table).select('*').order('created_at', {ascending:true}).order('id', {ascending:true}).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function loadAll() {
  const keys = Object.keys(TABLES);
  const res = await Promise.all(keys.map(k => fetchAll(TABLES[k])));
  keys.forEach((k, i) => S[k] = res[i]);
}
async function reload(...keys) {
  const res = await Promise.all(keys.map(k => fetchAll(TABLES[k])));

async function dbInsert(key, vals) {

async function dbUpdate(key, id, vals) {

/* ---------------- calculations ---------------- */
function msCalc(m) {
  const received = sum(S.receipts.filter(r => r.milestone_id === m.id), 'amount');
  const invoiced = !!(m.invoice_no || num(m.invoice_amount) > 0);
  const inv = num(m.invoice_amount);
  const gross = Math.round(inv * (1 + num(m.gst_pct) / 100) * 100) / 100;
  let status;
  if (!invoiced) status = received > 0 ? 'Advance Received' : 'Pending';
  else if (received <= 0) status = 'Invoiced';
  else if (received + 1 < gross) status = 'Partially Paid';
  else status = 'Paid';
  const outstanding = invoiced ? Math.max(gross - received, 0) : 0;
  const overdue = status !== 'Paid' && m.due_date && m.due_date < today();
  return { received, invoiced, inv, gross, outstanding, status, overdue };
}
function projCalc(p) {
  const id = p.id;
  const st = S.stages.filter(s => s.project_id === id).sort((a, b) => a.seq - b.seq);
  const tl = S.timeLogs.filter(t => t.project_id === id);
  const ex = S.expenses.filter(e => e.project_id === id);
  const ms = S.milestones.filter(m => m.project_id === id);
  const labour = sum(tl, 'cost'), exp = sum(ex, 'amount'), cost = labour + exp, po = num(p.po_value);
  const margin = po - cost, marginPct = po ? margin / po * 100 : null;
  const counted = st.filter(s => s.status !== 'Skipped');
  const done = counted.filter(s => s.status === 'Done').length;
  const progress = counted.length ? done / counted.length * 100 : 0;
  const cur = st.find(s => s.status !== 'Done' && s.status !== 'Skipped') || null;
  const mc = ms.map(msCalc);
  const invoicedGross = sum(mc, 'gross'), received = sum(mc, 'received'), outstanding = sum(mc, 'outstanding');
  const msPct = sum(ms, m => m.pct), msAmt = sum(ms, 'amount');
  const lateStage = st.some(s => s.status !== 'Done' && s.status !== 'Skipped' && s.planned_end && s.planned_end < today());
  const days = sum(tl, 'days');
  return { st, tl, ex, ms, labour, exp, cost, po, margin, marginPct, progress, cur, invoicedGross, received, outstanding, msPct, msAmt, lateStage, days };
}

   field: {k,label,type,options,required,full,help,step,min,section,placeholder}
   ===================================================================== */
function fieldHTML(f, v) {
  if (f.type === 'section') return `<div class="sect-title">${esc(f.label)}</div>`;
  const id = 'f_' + f.k, req = f.required ? ' <span class="req">*</span>' : '';
  let inp;
  const val = v ?? f.default ?? '';
  switch (f.type) {
    case 'select': inp = `<select id="${id}" name="${f.k}">${opt(f.options, val, f.blank === false ? undefined : (f.blank || '— Select —'))}</select>`; break;
    case 'textarea': inp = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`; break;
    case 'checks': { const arr = Array.isArray(val) ? val : [];
      inp = `<div class="checks">${f.options.map(o => `<label><input type="checkbox" name="${f.k}" value="${esc(o)}" ${arr.includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div>`; break; }
    case 'bool': inp = `<div class="checks"><label><input type="checkbox" name="${f.k}" ${val === true || val === '' && f.default ? 'checked' : ''}> ${esc(f.text || 'Yes')}</label></div>`; break;
    default: inp = `<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}" ${f.step ? `step="${f.step}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  }
  return `<div class="fld ${f.full || f.type === 'textarea' || f.type === 'checks' ? 'full' : ''}"><label for="${id}">${esc(f.label)}${req}</label>${inp}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
}
function formFieldsHTML(fields, values = {}) { return `<div class="form-grid">${fields.map(f => fieldHTML(f, values[f.k])).join('')}</div>`; }
function collectForm(root, fields) {
  const out = {}, errs = [];
  fields.forEach(f => {
    if (f.type === 'section') return;
    if (f.type === 'checks') { out[f.k] = [...root.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i => i.value); return; }
    const el = root.querySelector(`[name="${f.k}"]`); if (!el) return;
    if (f.type === 'bool') { out[f.k] = el.checked; return; }
    let v = el.value.trim();
    if (f.type === 'number') v = v === '' ? null : Number(v);
    else if (v === '') v = null;
    if (f.type === 'number' && v !== null && !isFinite(v)) errs.push(`${f.label} must be a number`);
    if (f.required && (v === null || v === '')) errs.push(`${f.label} is required`);
    out[f.k] = v;
  });
  return { vals: out, errs };
}
function setField(root, k, v) { const el = root.querySelector(`[name="${k}"]`); if (el) el.value = v ?? ''; }

function closeModal() { $('#modalRoot').innerHTML = ''; }
function openForm({ title, fields, values = {}, onSave, onDelete, onChange, submit = 'Save', wide, note }) {
  $('#modalRoot').innerHTML = `<div class="modal-bg"><form class="modal ${wide ? 'wide' : ''}" novalidate>
    <div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close>✕</button></div>
    <div class="modal-b"><div class="alert err form-err hidden"></div>${note ? `<div class="alert warn">${note}</div>` : ''}${formFieldsHTML(fields, values)}</div>
    <div class="modal-f">${onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : ''}
      <div class="r"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">${esc(submit)}</button></div></div>
  </form></div>`;
  const form = $('#modalRoot form'), errBox = form.querySelector('.form-err'), btn = form.querySelector('[type=submit]');
  form.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  const showErr = m => { errBox.innerHTML = esc(m); errBox.classList.remove('hidden'); form.querySelector('.modal-b').scrollTop = 0; };
  if (onChange) form.addEventListener('input', e => { if (e.target.name) onChange(e.target.name, collectForm(form, fields).vals, (k, v) => setField(form, k, v)); });
  form.onsubmit = async e => {
    e.preventDefault(); if (btn.disabled) return;
    const { vals, errs } = collectForm(form, fields);
    if (errs.length) return showErr(errs.join(' · '));
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
    try { await onSave(vals); closeModal(); render(); }
    catch (err) { showErr(niceErr(err)); btn.disabled = false; btn.textContent = old; }
  };
  if (onDelete) form.querySelector('[data-del]').onclick = async ev => {
    if (!await confirmBox('Delete this record? This cannot be undone.')) return;
    ev.target.disabled = true;
    try { await onDelete(); closeModal(); render(); toast('Deleted'); } catch (err) { showErr(niceErr(err)); ev.target.disabled = false; }
  };
  if (window.matchMedia('(min-width: 861px)').matches) form.querySelector('input:not([type=checkbox]),select,textarea')?.focus();
  return form;
}
function confirmBox(msg, okText = 'Delete') {
  return new Promise(res => {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="modal-bg" style="z-index:120"><div class="modal" style="max-width:420px">
      <div class="modal-b" style="padding-top:22px">${esc(msg)}</div>
      <div class="modal-f"><div class="r"><button class="btn" data-n>Cancel</button><button class="btn primary" data-y>${esc(okText)}</button></div></div></div></div>`;
    document.body.appendChild(wrap);
    const done = v => { wrap.remove(); res(v); };
    wrap.querySelector('[data-n]').onclick = () => done(false);
    wrap.querySelector('[data-y]').onclick = () => done(true);
  });
}
async function guarded(btn, fn) {
  if (btn && btn.disabled) return; if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(niceErr(e), true); } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
}

const kpi = (l, v, s = '', cls = '') => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const emptyRow = (cols, msg) => `<tr><td colspan="${cols}" class="empty">${msg}</td></tr>`;

/* ---------- Dashboard ---------- */
function pgDashboard() {
  const t = today(), in14 = addDays(t, 14);
  const active = S.projects.filter(p => p.status === 'Active');
  const calcs = active.map(p => ({ p, c: projCalc(p) }));
  const activeIds = new Set(active.map(p => p.id));
  const openSt = S.stages.filter(s => activeIds.has(s.project_id) && s.status !== 'Done' && s.status !== 'Skipped');
  const odStages = openSt.filter(s => s.planned_end && s.planned_end < t);
  const openTasks = S.tasks.filter(x => x.status !== 'Done' && (P(x.project_id)?.status !== 'Cancelled'));
  const odTasks = openTasks.filter(x => x.due_date && x.due_date < t);
  const allMs = S.milestones.map(m => ({ m, c: msCalc(m) }));
  const outstanding = sum(allMs, x => x.c.outstanding);
  const odMs = allMs.filter(x => x.c.overdue && P(x.m.project_id)?.status !== 'Cancelled');
  const po = sum(calcs, x => x.c.po), cost = sum(calcs, x => x.c.cost);
  const doneProj = S.projects.filter(p => p.status === 'Completed').map(p => projCalc(p));
  const donePo = sum(doneProj, 'po'), doneMargin = sum(doneProj, 'margin');
  const pipe = STAGES.map((s, i) => calcs.filter(x => x.c.cur && x.c.cur.seq === i + 1).length);

  const overdue = [
    ...odStages.map(s => ({ d: s.planned_end, html: `<div><b>${esc(s.stage)}</b> <span class="muted">stage</span><div class="small muted">${esc(projLabel(P(s.project_id)))}</div></div>`, pid: s.project_id, tab: 'stages' })),
    ...odTasks.map(x => ({ d: x.due_date, html: `<div><b>${esc(x.title)}</b> <span class="muted">task</span><div class="small muted">${esc(projLabel(P(x.project_id)))}</div></div>`, pid: x.project_id, tab: 'tasks' })),
    ...odMs.map(x => ({ d: x.m.due_date, html: `<div><b>${esc(x.m.label)}</b> <span class="muted">payment</span><div class="small muted">${esc(projLabel(P(x.m.project_id)))}</div></div>`, pid: x.m.project_id, tab: 'payments' }))
  ].sort((a, b) => a.d.localeCompare(b.d));
  const upcoming = [
    ...openSt.filter(s => s.planned_end && s.planned_end >= t && s.planned_end <= in14).map(s => ({ d: s.planned_end, html: `<div><b>${esc(s.stage)}</b> <span class="muted">stage ends</span><div class="small muted">${esc(projLabel(P(s.project_id)))}</div></div>`, pid: s.project_id, tab: 'stages' })),
    ...openTasks.filter(x => x.due_date && x.due_date >= t && x.due_date <= in14).map(x => ({ d: x.due_date, html: `<div><b>${esc(x.title)}</b> <span class="muted">task</span><div class="small muted">${esc(projLabel(P(x.project_id)))}</div></div>`, pid: x.project_id, tab: 'tasks' })),
    ...allMs.filter(x => x.c.status !== 'Paid' && x.m.due_date && x.m.due_date >= t && x.m.due_date <= in14).map(x => ({ d: x.m.due_date, html: `<div><b>${esc(x.m.label)}</b> <span class="muted">payment expected</span><div class="small muted">${esc(projLabel(P(x.m.project_id)))}</div></div>`, pid: x.m.project_id, tab: 'payments' }))
  ].sort((a, b) => a.d.localeCompare(b.d));
  const li = (x, late) => `<div class="list-item click" data-act="go" data-href="#/project/${x.pid}/${x.tab}" style="cursor:pointer">${x.html}<span class="badge ${late ? 'b-red' : 'b-blue'}">${fd(x.d)}</span></div>`;

  return pageHead('Dashboard', new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Asia/Kolkata' }),
    `<button class="btn" data-act="newTime">＋ Log time</button><button class="btn primary" data-act="newProject">＋ New project</button>`) +
  `<div class="kpis">
    ${kpi('Active projects', active.length, `${S.projects.filter(p => p.status === 'On Hold').length} on hold`)}
    ${kpi('Active PO value', inr(po), 'excl. GST')}
    ${kpi('Cost to date', inr(cost), po ? pct(cost / po * 100) + ' of PO' : '')}
    ${kpi('Outstanding', inr(outstanding), `${odMs.length} payment(s) overdue`, odMs.length ? 'warn' : '')}
    ${kpi('Overdue items', odStages.length + odTasks.length, `${odStages.length} stages · ${odTasks.length} tasks`, odStages.length + odTasks.length ? 'warn' : 'good')}
    ${kpi('Completed margin', donePo ? pct(doneMargin / donePo * 100) : '—', donePo ? inr(doneMargin) + ' on ' + doneProj.length + ' project(s)' : 'No completed projects yet')}
  </div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Active projects by current stage</h3></div><div class="card-b">
    <div class="pipeline">${STAGES.map((s, i) => `<div class="pipe ${pipe[i] ? 'on' : ''}"><div class="n">${pipe[i]}</div><div class="t">${esc(s)}</div></div>`).join('')}</div>
  </div></div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="card-h"><h3>Overdue</h3>${badge(overdue.length, overdue.length ? 'b-red' : 'b-green')}</div>
      ${overdue.length ? overdue.slice(0, 12).map(x => li(x, true)).join('') : '<div class="empty">Nothing overdue 👍</div>'}</div>
    <div class="card"><div class="card-h"><h3>Next 14 days</h3>${badge(upcoming.length, 'b-blue')}</div>
      ${upcoming.length ? upcoming.slice(0, 12).map(x => li(x, false)).join('') : '<div class="empty">Nothing due in the next two weeks</div>'}</div>
  </div>
  <div class="card"><div class="card-h"><h3>Active projects</h3><a href="#/projects" class="small">All projects →</a></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th>Client</th><th>Current stage</th><th>Progress</th><th>Target</th><th class="num">PO value</th><th class="num">Cost</th><th class="num">Margin</th></tr></thead><tbody>
    ${calcs.length ? calcs.sort((a, b) => b.p.project_no.localeCompare(a.p.project_no)).map(({ p, c }) => `<tr class="click" data-act="go" data-href="#/project/${p.id}/overview">
      <td><b>${esc(p.project_no)}</b><div class="small muted">${esc(p.name)}</div></td><td>${esc(clientName(p.client_id))}</td>
      <td>${c.cur ? esc(c.cur.stage) : '—'} ${c.lateStage ? badge('Late', 'b-red') : ''}</td><td>${progBar(c.progress)}</td>
      <td class="nowrap">${fd(p.target_date)}</td><td class="num">${inr(c.po)}</td><td class="num">${inr(c.cost)}</td>
      <td class="num">${badge(pct(c.marginPct), marginCls(c.marginPct))}</td></tr>`).join('') : emptyRow(8, 'No active projects. <a href="#" data-act="newProject">Create the first one</a>.')}
    </tbody></table></div></div>`;
}

function timelineHTML(st) {
  const ds = [];
  st.forEach(s => ['planned_start','planned_end','actual_start','actual_end'].forEach(k => s[k] && ds.push(s[k])));
  if (ds.length < 2) return '<div class="muted small">Add planned dates (or use Auto-plan) to see the timeline.</div>';
  const t = today();
  ds.sort(); let min = ds[0], max = ds[ds.length - 1];
  if (st.some(s => s.actual_start && !s.actual_end) && t > max) max = t;
  const span = Math.max(daysBetween(min, max) + 1, 1);
  const pos = d => (daysBetween(min, d) / span * 100);
  const w = (a, b) => Math.max((daysBetween(a, b) + 1) / span * 100, 0.8);
  const todayLine = t >= min && t <= max ? `<div class="tl-today" style="left:${pos(t)}%" title="Today"></div>` : '';
  return `<div class="tl">${st.map(s => {
    const plan = s.planned_start && s.planned_end ? `<div class="tl-plan" style="left:${pos(s.planned_start)}%;width:${w(s.planned_start, s.planned_end)}%" title="Planned ${fd(s.planned_start)} → ${fd(s.planned_end)}"></div>` : '';
    const aEnd = s.actual_end || (s.actual_start ? (t < s.actual_start ? s.actual_start : t) : null);
    const act = s.actual_start ? `<div class="tl-act ${s.actual_end ? 'done' : ''}" style="left:${pos(s.actual_start)}%;width:${w(s.actual_start, aEnd)}%" title="Actual ${fd(s.actual_start)} → ${s.actual_end ? fd(s.actual_end) : 'ongoing'}"></div>` : '';
    return `<div class="tl-row"><div class="lbl" title="${esc(s.stage)}">${s.seq}. ${esc(s.stage)}</div><div class="tl-track">${plan}${act}${todayLine}</div></div>`;
  }).join('')}</div>
  <div class="tl-legend"><span><i style="background:#C9D3E3"></i>Planned</span><span><i style="background:var(--orange)"></i>In progress</span><span><i style="background:var(--green)"></i>Done</span><span><i style="background:var(--red);width:3px"></i>Today</span><span>${fd(min)} → ${fd(max)}</span></div>`;
}
function tabStages(p, c) {

  return `<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Timeline</h3>
      <button class="btn sm" data-act="autoPlan" data-id="${p.id}" title="Spread planned dates between start and target date">Auto-plan dates</button></div>
    <div class="card-b">${timelineHTML(c.st)}</div></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Stage</th><th>Planned</th><th>Actual</th><th>Status</th><th>Remarks</th><th></th></tr></thead><tbody>

}

      ${Object.keys(TABLES).map(k => `<tr><td>${TABLES[k]}</td><td class="num">${S[k].length}</td></tr>`).join('')}

async function doBackup(btn) {
  await guarded(btn, async () => {
    loading(true, 'Preparing backup…');
    try {
      const out = { app: 'averon-project-tracker', version: 1, exported_at: new Date().toISOString(), tables: {} };
      for (const k of Object.keys(TABLES)) out.tables[TABLES[k]] = await fetchAll(TABLES[k]);
      try { out.tables.audit_log = await fetchAll('audit_log'); } catch (e) { /* optional */ }
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `averon-projects-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
    } finally { loading(false); }
  });
}

async function autoPlan(pid, btn) {
  const p = P(pid);
  if (!p.start_date || !p.target_date) return toast('Set the project start and target dates first (Edit project)', true);
  const total = daysBetween(p.start_date, p.target_date) + 1;
  if (total < STAGES.length) return toast('Start → target is too short to spread 9 stages', true);
  const st = S.stages.filter(s => s.project_id === pid).sort((a, b) => a.seq - b.seq);
  if (st.some(s => s.planned_start || s.planned_end) && !await confirmBox('This will overwrite the existing planned dates for all stages.', 'Overwrite')) return;
  const wsum = STAGE_WEIGHTS.reduce((a, b) => a + b, 0);
  await guarded(btn, async () => {
    let cum = 0;
    for (let i = 0; i < st.length; i++) {
      const s0 = Math.round(cum / wsum * total); cum += STAGE_WEIGHTS[i] || 1;
      const e0 = Math.max(s0, Math.round(cum / wsum * total) - 1);
      const { error } = await sb.from('project_stages').update({ planned_start: addDays(p.start_date, s0), planned_end: addDays(p.start_date, Math.min(e0, total - 1)) }).eq('id', st[i].id);
      if (error) throw error;
    }
    await reload('stages'); render(); toast('Planned dates set — adjust any stage as needed');
  });
}
const ACTIONS = {
  openNav: () => $('#app').classList.add('nav-open'),
  closeNav: () => $('#app').classList.remove('nav-open'),
  logout: async () => { USER = null; await sb.auth.signOut(); showLogin(); },
  go: d => { location.hash = d.href; },
  newProject: () => openProjectForm(null),
  editProject: d => openProjectForm(P(d.id)),
  editStage: d => openStageForm(S.stages.find(s => s.id === d.id)),
  stageStart: (d, el) => guarded(el, async () => { await dbUpdate('stages', d.id, { status: 'In Progress', actual_start: today() }); render(); toast('Stage started'); }),
  stageDone: (d, el) => guarded(el, async () => { const s = S.stages.find(x => x.id === d.id);
    await dbUpdate('stages', d.id, { status: 'Done', actual_start: s.actual_start || today(), actual_end: today() }); render();
    const left = S.stages.filter(x => x.project_id === s.project_id && x.status !== 'Done' && x.status !== 'Skipped').length;
    toast(left ? 'Stage completed' : 'All stages done — mark the project Completed from Edit'); }),
  autoPlan: (d, el) => autoPlan(d.id, el),
  newTask: d => openTaskForm(null, d.pid),
  editTask: d => openTaskForm(S.tasks.find(t => t.id === d.id)),
  toggleTask: (d, el) => guarded(el, async () => { const done = el.checked; await dbUpdate('tasks', d.id, { status: done ? 'Done' : 'Open', completed_at: done ? today() : null }); render(); }),
  newTime: d => openTimeForm(null, d.pid),
  editTime: d => openTimeForm(S.timeLogs.find(t => t.id === d.id)),
  newExpense: d => openExpenseForm(null, d.pid),
  editExpense: d => openExpenseForm(S.expenses.find(x => x.id === d.id)),
  newMilestone: d => openMilestoneForm(null, d.pid),
  editMilestone: d => { openMilestoneForm(S.milestones.find(m => m.id === d.id)); if (d.focus) $('#f_' + d.focus)?.focus(); },
  newReceipt: d => openReceiptForm(null, d.id),
  editReceipt: d => openReceiptForm(S.receipts.find(r => r.id === d.id)),
  editBudget: d => openBudgetForm(P(d.id)),
  newClient: () => openClientForm(null),
  editClient: d => openClientForm(C(d.id)),
  newEngineer: () => openEngineerForm(null),
  editEngineer: d => openEngineerForm(E(d.id)),
  masterTab: d => { UI.masterTab = d.tab; render(); },
  backup: (d, el) => doBackup(el)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  if (el.tagName === 'TR' && e.target.closest('a,button,input')) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset, el);
});

/* =====================================================================
   ROUTER
   ===================================================================== */
function render() {
  if (!USER) return;
  const parts = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('/');
  const page = parts[0];
  const navKey = page === 'project' ? 'projects' : page;
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" class="${k === navKey ? 'active' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</a>`).join('');
  const html = ({ dashboard: pgDashboard, projects: pgProjects, project: () => pgProject(parts[1], parts[2]), tasks: pgTasks, entry: pgEntry,
    receivables: pgReceivables, masters: pgMasters, backup: pgBackup }[page] || pgDashboard)();
  const ct = $('#content'), scroll = window.scrollY, same = render._last === location.hash;
  ct.innerHTML = html; render._last = location.hash;
  if (!same) window.scrollTo(0, 0); else window.scrollTo(0, scroll);
  // page-specific bindings
  if (page === 'projects') {
    $('#projSearch').addEventListener('input', debounce(e => { UI.projSearch = e.target.value; $('#projBody').innerHTML = projectRows(); }, 250));
    $('#projStatus').onchange = e => { UI.projStatus = e.target.value; $('#projBody').innerHTML = projectRows(); };
  }
  if (page === 'tasks') {
    $('#taskProject').onchange = e => { UI.taskProject = e.target.value; render(); };
    $('#taskStatus').onchange = e => { UI.taskStatus = e.target.value; render(); };
  }
  if (page === 'entry') bindEntry();
}
window.addEventListener('hashchange', () => { $('#app').classList.remove('nav-open'); closeModal(); render(); });

/* =====================================================================
   AUTH / BOOT
   ===================================================================== */
function showLogin(msg) {
  USER = null; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  const e = $('#loginErr'); if (msg) { e.textContent = msg; e.classList.remove('hidden'); } else e.classList.add('hidden');
  $('#lgBtn').disabled = false; $('#lgBtn').textContent = 'Sign in';
}
async function boot(session) {
  loading(true, 'Loading projects…');
  try {
    const { data: mem, error: me } = await sb.from('app_users').select('user_id').eq('user_id', session.user.id).maybeSingle();
    if (me) throw me;
    if (!mem) { await sb.auth.signOut(); loading(false); return showLogin('This account is not authorised for the Averon Project Tracker.'); }
    USER = session.user;
    await loadAll();
    $('#whoami').textContent = USER.email;
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    render();
  } catch (e) {
    showLogin('Could not load data: ' + niceErr(e));
  } finally { loading(false); }
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); const btn = $('#lgBtn'); if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Signing in…'; $('#loginErr').classList.add('hidden');
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPass').value });
  if (error) return showLogin(error.message === 'Invalid login credentials' ? 'Wrong email or password.' : error.message);
  await boot(data.session);
};
// Keep the auth listener light (no awaits inside) to avoid the supabase-js deadlock
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT' && USER) setTimeout(() => showLogin('You have been signed out.'), 0); });

// Inline PWA manifest (single-file deploy)
(() => {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#1B2A41"/><text x="256" y="340" font-family="Arial" font-weight="700" font-size="300" text-anchor="middle" fill="#E8702A">A</text></svg>');
  const m = { name:'Averon Project Tracker', short_name:'Averon Projects', start_url: location.href.split('#')[0], display:'standalone', background_color:'#1B2A41', theme_color:'#1B2A41',
    icons:[{ src: icon, sizes:'512x512', type:'image/svg+xml', purpose:'any' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type:'application/manifest+json' })); document.head.appendChild(l);
  const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = icon; document.head.appendChild(ai);
  const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = icon; document.head.appendChild(fi);
})();

(async () => {
  if (SUPABASE_URL.includes('YOUR-PROJECT')) { showLogin('Setup needed: paste your Supabase URL and anon key at the top of the script in index.html.'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (session) boot(session); else showLogin();
})();
</script>
